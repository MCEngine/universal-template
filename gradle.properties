# --- Gradle behaviour ---
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true

# --- Project identity ---
# Rename these three when you fork this template; everything else is derived
# from them. The full checklist is in PROMPT.md at the repository root.
#   orgname  + reponame -> group io.github.<orgname>
#                       -> namespace io.github.<orgname>.<reponame>
#   pluginid            -> class names and jar base names, e.g. TemplateEngine
# Both orgname and reponame become Java package segments, so they must be
# lowercase with no hyphens, dots, or spaces.
orgname=mcengine
reponame=universaltemplate
pluginid=Template

# --- Git coordinates ---
# The literal GitHub owner and repository. Used only to build the GitHub
# Packages URL, which needs the real repository name including its hyphen.
git-org-name=MCEngine
git-repository=universal-template

# --- Versioning ---
# Don't update project-version until ready for release.
project-version=0.0.0

# --- Toolchain and Bukkit targets ---
# Minecraft 1.21.11 requires Java 21 (Mojang version manifest, javaVersion 21),
# so one toolchain covers every module, mods included.
#
# 1.21.11 rather than a 26.x release, deliberately: Mojang stopped publishing
# obfuscation mappings with the 26.x line, and Yarn has no 26.x builds either.
# Every mod toolchain -- Loom, ModDevGradle, and its legacy Forge variant --
# needs those mappings, so no mod can be built for 26.x at all. 1.21.11 is the
# most recent release that has them, and every platform below ships for it, so
# the client mod and the server plugin target the same game and can actually
# talk to each other.
foojay-resolver-version=1.0.0
java-version=21
minecraft-version=1.21.11
spigot-api-version=1.21.11-R0.2-SNAPSHOT
paper-api-version=1.21.11-R0.1-SNAPSHOT
folia-api-version=1.21.11-R0.1-SNAPSHOT
shadow-version=9.4.1
# Declared in plugin.yml as the oldest server API this plugin is built against.
plugin-api-version=1.21

# --- Mod loader targets, used only when mods are enabled ---
# The six mod modules are excluded from the build unless you pass -Pmods=true,
# because their toolchains download and decompile Minecraft on first run.
forge-version=1.21.11-61.2.1
neoforge-version=21.11.45
fabric-loader-version=0.19.5
fabric-api-version=0.141.6+1.21.11
fabric-yarn-version=1.21.11+build.6
loom-version=1.17.20
moddevgradle-version=2.0.146

# --- Testing ---
junit-version=6.1.0
mockito-version=5.23.0
